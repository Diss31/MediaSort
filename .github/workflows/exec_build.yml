name: Executables' Build
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  date_executable:
    runs-on: windows-2025
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            Filter_scripts/requirements.txt
            Filter_scripts/requirements-dev.txt
      - name: Build date executable
        run: |
          cd Filter_scripts/
          pip install -r requirements.txt requirements-dev.txt
          pyinstaller --onefile group_photos_by_date.py
      - name: Upload date executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: date_executable
          path: Filter_scripts/dist/group_photos_by_date.exe
