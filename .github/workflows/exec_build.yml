name: Executables' Build
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  mediasort_executable:
    runs-on: windows-2025
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install project and packaging tool
        run: uv sync --locked --extra exe
      # One executable running every filter; there are no per-filter executables.
      - name: Build mediasort executable
        run: uv run pyinstaller --onefile --name mediasort entrypoints/mediasort_entry.py
      - name: Upload mediasort executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mediasort_executable
          path: dist/mediasort.exe
