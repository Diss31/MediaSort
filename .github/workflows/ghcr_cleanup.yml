name: GHCR Cleanup
# Reusable workflow: build workflows call it as a final job after promoting
# latest, so a run here implies latest was just moved and is the newest
# version of each package. min-versions-to-keep therefore protects it without
# having to resolve and exclude its digest explicitly.
#
# With a single caller today (image_build), being reusable is deliberate
# over-engineering kept for learning purposes: it only pays off later, once
# several workflows produce Docker images and each can call this with its own
# package list instead of duplicating the cleanup logic.
on:
  workflow_call:
    inputs:
      packages:
        description: JSON array of GHCR package names to prune.
        required: true
        type: string
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    # Callers must grant at least this much; a called workflow can only
    # downgrade the caller's token, never elevate it.
    permissions:
      packages: write
    strategy:
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    steps:
      - name: Delete old image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 5
